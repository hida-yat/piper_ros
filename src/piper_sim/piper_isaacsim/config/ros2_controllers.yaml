# ros2_control controller_manager config for the Isaac Sim bridge -- same
# controller/action layer as piper_gazebo's with-gripper config (arm_controller
# + gripper_controller + gripper8_controller, all FollowJointTrajectory), just
# running on top of topic_based_ros2_control instead of gazebo_ros2_control.
# moveit_controllers.yaml (in piper_with_gripper_moveit) only needs
# arm_controller/gripper_controller to exist by these names -- unchanged.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz, matches go2_in_isaacsim's physics_dt (1/200)

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper8_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper_controller:
  ros__parameters:
    joints:
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

gripper8_controller:
  ros__parameters:
    joints:
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
